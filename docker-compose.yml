name: fullstack-pz7

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: notes
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d notes"]
      interval: 5s
      timeout: 3s
      retries: 10

  # TODO: server — приблизно десять рядків:
  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://demo:demo@db:5432/notes?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  db-data:
